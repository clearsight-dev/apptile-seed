buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 25
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        okhttp = "4.12.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath 'com.google.gms:google-services:4.4.2'
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://storage.googleapis.com/logrocket-maven/" }
        // Zego Express SDK Maven — needed for compileOnly in app/build.gradle
        // so MainActivity compiles regardless of whether the RN Zego module
        // is autolinked (ENABLE_LIVELY flag).
        maven { url "https://storage.zego.im/maven" }
        jcenter() {
            content {
                includeModule("com.yqritc", "android-scalablevideoview")
            }
        }
        // flatDir {
        //     dirs "$rootDir/libs"
        // }
    }
}

// Apply lint configuration to all subprojects (excluding root which is already evaluated)
// This disables NullSafeMutableLiveData which has a bug with this Kotlin/AGP version
subprojects {
    afterEvaluate {
        if (project.hasProperty('android')) {
            project.android {
                lint {
                    lintConfig rootProject.file("lint.xml")
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
